name: Arduino CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the code from your repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Install the Arduino Command Line Interface
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    # 3. Update the package index for boards
    - name: Update Board Index
      run: arduino-cli core update-index

    # 4. Download files for the board family (e.g., Uno, Nano, Mega)
    - name: Install Arduino AVR Core
      run: arduino-cli core install arduino:avr

    # 5. Compile your sketch to test for code errors
    # NOTE: Replace 'MyProject/MyProject.ino' with your actual folder/file path
    - name: Compile Sketch
      run: arduino-cli compile --fqbn arduino:avr:uno homerhomer/Storm23/Storm23.ino
